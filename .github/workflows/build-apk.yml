name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unzip project
        run: |
          for z in ./*.zip; do unzip -q -o "$z"; done
          ls
      - name: Prepare Android project
        working-directory: vika-yarik
        run: |
          npm install
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android
      - name: Build APK
        working-directory: vika-yarik/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vika-yarik-apk
          path: vika-yarik/android/app/build/outputs/apk/debug/app-debug.apk
